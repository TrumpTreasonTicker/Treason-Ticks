name: Hourly BlueSky Bot

on:
  schedule:
    - cron: '0 12,0 * * *'
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4  # <-- Updated to v4 to fix the Node warning

      - name: Set up Python
        uses: actions/setup-python@v5  # <-- Updated to v5 to fix the Node warning
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps  # <-- Added --with-deps so the cloud server has all required files!

      - name: Run Bot
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python bot.py
